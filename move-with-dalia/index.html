<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Move With Dalia</title><style>:root{--g:#58745a;--bg:#eef2ec;--ink:#202720;--line:#d9e0d8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f6f1ea,#e8eee7);color:var(--ink)}header{padding:18px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}h1{margin:0;font-size:28px}.sub{font-size:12px;letter-spacing:1.4px;color:#667067;margin-top:4px}.app{max-width:980px;margin:auto;background:#fff;min-height:100vh}.wrap{display:grid;grid-template-columns:290px 1fr}.side{padding:14px;border-right:1px solid var(--line);background:#fbfaf7}.item{width:100%;border:0;background:#fff;text-align:left;padding:12px;border-radius:13px;margin:4px 0;font-weight:700}.item.active{background:#e7efe7;color:#36513c}.main{padding:18px}.cat{font-size:12px;font-weight:800;color:var(--g);letter-spacing:1px}.title{font-size:34px;font-weight:900;margin:5px 0 8px}.summary{line-height:1.5;color:#506052}.timer{font-size:40px;font-weight:900;background:var(--bg);display:inline-block;padding:12px 18px;border-radius:18px;margin:14px 0}.photo{height:520px;border-radius:22px;overflow:hidden;background:#edf2ec}.photo img{width:100%;height:100%;object-fit:cover;display:block}.step{margin-top:12px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}.step strong{display:block;font-size:20px;margin-bottom:5px}.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:10px}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:14px;padding:13px;font-weight:800;background:#e8eee7}.btn.primary{background:var(--g);color:#fff}.card{border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}.card h3{margin:0 0 8px}.card ul{margin:0;padding-left:20px;line-height:1.7}.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}.level{background:var(--bg);padding:12px;border-radius:12px;font-size:13px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);max-height:230px;overflow:auto}.photo{height:500px}.title{font-size:30px}}</style></head><body><div class="app"><header><h1>Move With Dalia</h1><div class="sub">15 EQUIPMENT-FREE MOVEMENT BASICS</div></header><div class="wrap"><aside class="side" id="list"></aside><main class="main"><div class="cat" id="cat"></div><div class="title" id="title"></div><div class="summary" id="summary"></div><div class="timer" id="timer">00:40</div><div class="photo"><img src="assets/studio_start.svg" alt="AI workout model"></div><div class="step"><strong id="stepTitle"></strong><span id="stepText"></span></div><div class="controls"><button class="btn" onclick="prevStep()">‹ Previous</button><button class="btn primary" id="play" onclick="toggleSteps()">▶ Play Steps</button><button class="btn" onclick="nextStep()">Next ›</button></div><div class="card"><h3>Starting position</h3><div id="setup"></div></div><div class="card"><h3>Key form cues</h3><ul id="cues"></ul></div><div class="card"><h3>Adjust the difficulty</h3><div class="levels"><div class="level"><b>Easier</b><br><span id="easy"></span></div><div class="level"><b>Harder</b><br><span id="hard"></span></div></div></div><div class="controls"><button class="btn primary" id="timerBtn" onclick="toggleTimer()">▶ Start Timer</button><button class="btn" onclick="resetTimer()">↻ Reset</button><button class="btn" onclick="markDone()">✓ Complete</button></div></main></div></div><script>const E=[['Foundations','Forward Walking',60,'Walk forward at a comfortable, pain-free pace.','Stand tall in a clear space.',['Use smooth steps','Keep shoulders relaxed','Look forward'],'Take shorter steps.','Walk a little faster.',['Ready|Stand tall with weight balanced.','Step|Move one foot forward.','Transfer|Shift smoothly over the front foot.','Continue|Repeat with the other leg.']],['Foundations','Backward Walking',60,'Walk backward slowly with small controlled steps.','Check the area behind you before starting.',['Begin with tiny steps','Place forefoot first','Stay tall'],'Hold a wall lightly.','Use longer steps.',['Ready|Check the space behind you.','Reach Back|Move one foot backward.','Set Foot|Place the forefoot gently.','Repeat|Continue with the other foot.']],['Foundations','Lateral Side-Step Walking',45,'Travel sideways in both directions.','Stand tall with knees soft.',['Keep toes forward','Do not cross feet','Train both directions'],'Use tiny side steps.','Move slightly faster.',['Ready|Feet under hips.','Open|Step to the side.','Close|Bring the other foot in.','Reverse|Travel the other way.']],['Foot & Ankle','Big-Toe Extension Stretch',30,'Gently load the toes and forefoot.','Kneel with toes tucked under and hands supported.',['Use gentle pressure','Do not bounce','Move gradually'],'Keep weight in hands.','Sit farther back.',['Set Toes|Tuck toes under.','Shift Back|Move hips toward heels.','Hold|Pause gently.','Release|Shift forward.']],['Foot & Ankle','Wall Tibialis Raise',40,'Lift toes toward shins while heels stay planted.','Stand with back near a wall and feet forward.',['Keep heels down','Lift toes high','Lower slowly'],'Stand closer to wall.','Move feet farther away.',['Ready|Heels down and toes relaxed.','Lift|Pull toes upward.','Top|Reach the highest controlled lift.','Lower|Return slowly.']],['Foot & Ankle','Two-Leg Calf Raise',40,'Rise onto both forefeet and lower slowly.','Stand tall with feet hip-width.',['Press evenly','Keep ankles aligned','Pause at top'],'Touch wall for balance.','Slow the lowering.',['Ready|Both feet flat.','Rise|Lift both heels.','Top|Balance with control.','Lower|Return heels slowly.']],['Knee & Squat','Bodyweight Squat Progression',45,'Squat to the deepest comfortable position you control.','Use a comfortable stance with arms forward.',['Knees track with toes','Keep feet grounded','Lead up with chest'],'Use shallow depth.','Gradually squat deeper.',['Ready|Stand tall.','Descend|Bend knees and hips.','Bottom|Pause at comfortable depth.','Stand|Press through feet.']],['Knee & Squat','Horse-Stance Squat',40,'Use a wide stance and sit between the legs.','Stand wide with toes turned naturally.',['Knees follow toes','Keep torso tall','Use comfortable depth'],'Use narrower stance.','Hold bottom longer.',['Wide Stance|Stand wide.','Knees Out|Begin bending.','Sit Down|Lower between legs.','Rise|Stand with control.']],['Hip & Groin','Butterfly Stretch',30,'Open the hips gently with soles together.','Sit tall with soles of feet together.',['Do not bounce','Breathe slowly','Use gentle pressure'],'Move feet farther away.','Bring feet closer.',['Set Up|Soles together.','Lengthen|Sit tall.','Relax|Let knees lower.','Hold|Breathe slowly.']],['Hip & Groin','90/90 Hip Switches',45,'Rotate both knees side to side.','Sit with knees bent and hands behind you.',['Move slowly','Use hands for support','Do not force knees'],'Lean back more.','Use less hand support.',['Center|Knees bent.','Left|Rotate both knees left.','Center|Return to middle.','Right|Rotate both knees right.']],['Posterior Chain','Elephant Walk',45,'Alternate straightening one leg at a time.','Fold forward with both knees bent.',['Move gently','Straighten one leg','Do not force range'],'Hands on thighs.','Hands lower.',['Fold|Bend both knees.','Left Leg|Straighten left leg.','Center|Bend both knees.','Right Leg|Straighten right leg.']],['Core & Hip Flexor','Seated Knee-Lift Progression',35,'Lift one or both feet with control.','Sit tall with knees bent and hands beside hips.',['Keep chest lifted','Do not swing','Use small range'],'Lift one foot.','Lift both feet.',['Ready|Sit tall.','Brace|Press hands down.','Lift|Raise the feet.','Lower|Return slowly.']],['Upper Body','Wall Push-Up',40,'Lower toward a wall and press away.','Place hands on wall slightly wider than shoulders.',['Keep body straight','Lower with control','Do not shrug'],'Stand closer.','Stand farther away.',['Ready|Hands on wall.','Lower|Bend elbows.','Bottom|Pause comfortably.','Press|Return to start.']],['Neck & Spine','Gentle Neck Extension',25,'Use a very small comfortable backward neck movement.','Sit or stand tall with hands lightly behind head.',['Use tiny range','Keep jaw relaxed','Stop for dizziness'],'Use an isometric hold.','Increase range carefully.',['Neutral|Head stacked tall.','Support|Hands behind head.','Extend|Guide slightly backward.','Return|Come back to neutral.']],['Elbow & Wrist','Wrist Flexion and Extension',35,'Move the wrist slowly up and down.','Hold forearm still with hand unsupported.',['Move only wrist','Use smooth pace','Stay comfortable'],'Use smaller range.','Pause at top and bottom.',['Neutral|Wrist straight.','Flex|Palm gently down.','Neutral|Return middle.','Extend|Back of hand upward.']]];let i=0,s=0,stepLoop=null,timerLoop=null,remain=E[0][2];const $=x=>document.getElementById(x);function renderList(){list.innerHTML='';E.forEach((e,n)=>{let b=document.createElement('button');b.className='item'+(n===i?' active':'');b.textContent=(n+1)+'. '+e[1];b.onclick=()=>{i=n;s=0;remain=e[2];render()};list.appendChild(b)})}function render(){let e=E[i];cat.textContent=e[0].toUpperCase();title.textContent=e[1];summary.textContent=e[3];setup.textContent=e[4];cues.innerHTML=e[5].map(x=>'<li>'+x+'</li>').join('');easy.textContent=e[6];hard.textContent=e[7];showStep();showTime();renderList()}function showStep(){let p=E[i][8][s].split('|');stepTitle.textContent=(s+1)+'. '+p[0];stepText.textContent=p[1]}function nextStep(){s=(s+1)%E[i][8].length;showStep()}function prevStep(){s=(s-1+E[i][8].length)%E[i][8].length;showStep()}function toggleSteps(){if(stepLoop){clearInterval(stepLoop);stepLoop=null;play.textContent='▶ Play Steps'}else{stepLoop=setInterval(nextStep,1400);play.textContent='❚❚ Pause Steps'}}function showTime(){timer.textContent='00:'+String(remain).padStart(2,'0')}function toggleTimer(){if(timerLoop){clearInterval(timerLoop);timerLoop=null;timerBtn.textContent='▶ Resume Timer'}else{timerLoop=setInterval(()=>{remain--;showTime();if(remain<=0){clearInterval(timerLoop);timerLoop=null;timerBtn.textContent='✓ Complete'}},1000);timerBtn.textContent='❚❚ Pause Timer'}}function resetTimer(){clearInterval(timerLoop);timerLoop=null;remain=E[i][2];showTime();timerBtn.textContent='▶ Start Timer'}function markDone(){alert('Exercise marked complete!')}render();</script></body></html>
